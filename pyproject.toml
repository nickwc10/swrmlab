[project]
name = "swrmlab-sim"
version = "0.1.0"
description = "Deterministic simulator for autonomous space battles, built from public information."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "numba",
    "pydantic>=2",
    "pyyaml",
    "matplotlib",
]

[project.scripts]
swarmsim = "swarmsim.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swarmsim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-W error"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["numba", "numba.*", "matplotlib", "matplotlib.*"]
ignore_missing_imports = true
